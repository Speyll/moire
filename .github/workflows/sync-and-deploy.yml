name: Sync wallpapers and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize runs so two pushes cannot race while updating the manifest and
# deploying. New runs wait instead of cancelling an in-progress deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Sync manifest
    runs-on: ubuntu-latest
    # A bot push (for example one made with a personal access token) and any
    # commit marked [skip ci] should not start another sync/deploy cycle.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize wallpaper manifest
        run: python3 scripts/sync_wallpapers.py

      - name: Commit manifest changes
        run: |
          set -euo pipefail

          if git diff --quiet -- data/wallpapers.json; then
            echo "Manifest is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/wallpapers.json
          git commit -m "chore: sync wallpaper manifest [skip ci]"

          # The concurrency group serializes runs, but a human push can still
          # land while this job is running. Rebase, re-run the sync, and amend
          # the bot commit so the manifest also covers any new images.
          git pull --rebase origin main
          python3 scripts/sync_wallpapers.py
          git add data/wallpapers.json

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          git push origin HEAD:main

      # The manifest is final at this point, including the re-sync after a
      # rebase, so the feeds always mirror the committed manual order.
      - name: Generate wallpaper feeds
        run: python3 scripts/generate_feeds.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # Keep .nojekyll and other hidden static files in the deployment.
          # Includes the generated feeds/ directory from the step above.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
