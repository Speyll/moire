media:
  - name: wallpapers
    label: Wallpapers
    input: images/wallpapers
    output: /images/wallpapers
    extensions: [jpg, jpeg, png, webp, avif]
    rename: false
    commit:
      templates:
        create: "media: add {filename}"
        update: "media: update {filename}"
        delete: "media: remove {filename}"
        rename: "media: rename {oldFilename} to {newFilename}"

content:
  - name: wallpapers
    label: Wallpapers
    type: file
    path: data/wallpapers.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: uuid
        required: true
        description: Generated automatically to keep each entry stable. Leave it alone.
        options:
          editable: false

      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120

      - name: image
        label: Wallpaper image
        type: image
        required: true
        description: Upload JPG, JPEG, PNG, WebP, or AVIF. The original filename is kept when available.
        options:
          media: wallpapers
          path: images/wallpapers
          extensions: [jpg, jpeg, png, webp, avif]
          rename: false

      - name: category
        label: Category
        type: string
        required: true
        description: A broad group such as Abstract, Nature, Architecture, or Minimal.
        options:
          maxlength: 60

      - name: tags
        label: Tags
        type: string
        list: true
        description: Add one tag at a time. Tags are used by search and the tag filter.

      - name: description
        label: Description
        type: text
        description: Optional. Shown in the full-resolution preview.
        options:
          maxlength: 600

      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first in Manual order. Use gaps such as 10, 20, 30 to make reordering easier.
        options:
          min: 0
